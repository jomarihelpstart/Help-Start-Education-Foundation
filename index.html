<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Collaborative Workspace Pro (Cloudinary Edition)</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        
        :root {
            --bg-main: #0f172a;       
            --bg-workspace: #f1f5f9;  
            --accent: #4f46e5;        
            --accent-hover: #4338ca;
            --danger: #ef4444;
            --danger-hover: #b91c1c;
            --text-dark: #1e293b;
            --border-color: #e2e8f0;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            background-color: var(--bg-workspace); 
            color: var(--text-dark); 
            overflow: hidden; 
        }

        .app-container { display: flex; flex: 1; overflow: hidden; }
        
        .sidebar { 
            width: 310px; 
            background: #ffffff; 
            padding: 24px; 
            border-right: 1px solid var(--border-color); 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
            box-shadow: 4px 0 24px rgba(15, 23, 42, 0.02); 
            z-index: 10; 
            overflow-y: auto; 
        }

        .sync-badge {
            background: linear-gradient(135deg, #4f46e5, #06b6d4);
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            text-align: center;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            align-self: flex-start;
            box-shadow: 0 2px 8px rgba(79, 70, 229, 0.15);
            margin-bottom: -5px;
        }
        
        .right-sidebar { 
            width: 320px; 
            background: #ffffff; 
            padding: 24px; 
            border-left: 1px solid var(--border-color); 
            display: flex; 
            flex-direction: column; 
            overflow-y: auto; 
            z-index: 10; 
            box-shadow: -4px 0 24px rgba(15, 23, 42, 0.02);
        }
        
        .main-area { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            background-image: radial-gradient(#cbd5e1 1.2px, transparent 0); 
            background-size: 24px 24px; 
            background-color: #f8fafc;
        }
        
        .workspace { 
            flex: 1; 
            padding: 40px; 
            display: flex; 
            justify-content: center; 
            align-items: flex-start; 
            overflow: auto; 
        }
        
        .image-container { 
            position: relative; 
            box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.08); 
            background: white; 
            border-radius: 12px; 
            display: none; 
            border: 1px solid #cbd5e1; 
            padding: 6px;
            transition: box-shadow 0.3s ease;
        }
        
        .image-container img { max-width: 100%; display: block; border-radius: 8px; pointer-events: none; }
        
        #textLayer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        .text-block-wrapper { 
            position: absolute; 
            cursor: move; 
            pointer-events: auto; 
            z-index: 50;
            user-select: none;
            touch-action: none;
        }

        .text-editable { 
            padding: 6px 10px; 
            font-weight: 700; 
            border: 2px dashed transparent; 
            min-width: 60px; 
            background: transparent; 
            white-space: nowrap; 
            border-radius: 6px; 
            display: inline-block;
            user-select: text;
        }
        .text-editable:focus, .text-block-wrapper.active .text-editable { 
            outline: none; 
            border: 2px dashed var(--accent); 
            background: rgba(255, 255, 255, 0.95); 
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05); 
        }
        
        .text-author { 
            position: absolute; 
            bottom: -20px; 
            left: 0; 
            font-size: 10px; 
            background: var(--accent); 
            color: white; 
            padding: 2px 6px; 
            border-radius: 4px; 
            font-weight: 600; 
            display: none; 
            pointer-events: none; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            z-index: 60;
            white-space: nowrap;
        }
        .text-block-wrapper.active .text-author, .text-block-wrapper:hover .text-author { display: block; }
        
        .user-badge { 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            padding: 10px 14px; 
            background: #f8fafc; 
            border: 1px solid var(--border-color);
            border-radius: 10px; 
            font-size: 13px; 
            font-weight: 600; 
            margin-bottom: 8px; 
        }
        
        .user-info { display: flex; align-items: center; gap: 10px; }
        .status-dot { width: 8px; height: 8px; background: #10b981; border-radius: 50%; display: inline-block; box-shadow: 0 0 10px #10b981; }
        
        .kick-user-btn {
            background: transparent;
            color: #94a3b8;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
        }
        .kick-user-btn:hover { background: #fee2e2; color: var(--danger); }
        
        h3 { font-size: 11px; text-transform: uppercase; color: #64748b; margin: 0 0 12px 0; letter-spacing: 0.8px; font-weight: 700; }
        .input-group { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; }
        
        input[type="text"], input[type="number"], select, input[type="file"] { 
            flex: 1; 
            padding: 10px 14px; 
            border: 1px solid var(--border-color); 
            border-radius: 8px; 
            font-family: inherit; 
            font-size: 13px; 
            font-weight: 500;
            background: #f8fafc;
        }
        input[type="text"]:focus, select:focus { outline: none; border-color: var(--accent); background: white; box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
        input[type="color"] { width: 46px; height: 38px; padding: 0; border: 1px solid var(--border-color); cursor: pointer; border-radius: 8px; background: none; }
        
        .btn { 
            padding: 10px 16px; 
            background: var(--accent); 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: 600; 
            font-family: inherit; 
            font-size: 13px; 
            display: flex; justify-content: center; align-items: center; gap: 6px;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.1);
            transition: all 0.2s;
        }
        .btn:hover { background: var(--accent-hover); transform: translateY(-1px); box-shadow: 0 6px 12px -1px rgba(79, 70, 229, 0.2); }
        .btn.outline { background: transparent; border: 1px solid var(--accent); color: var(--accent); box-shadow: none; }
        .btn.outline:hover { background: #f5f3ff; color: var(--accent-hover); }
        .btn.danger { border-color: var(--danger); color: var(--danger); }
        .btn.danger:hover { background: #fee2e2; color: var(--danger-hover); }
        
        .folder-item { 
            background: #ffffff; 
            border: 1px solid var(--border-color); 
            padding: 14px; 
            border-radius: 12px; 
            margin-bottom: 10px; 
            cursor: pointer; 
            position: relative; 
            transition: all 0.2s ease;
        }
        .folder-item:hover { border-color: #cbd5e1; transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(15, 23, 42, 0.04); }
        .folder-item.active { background: #f5f3ff; border-color: var(--accent); }
        
        .folder-name { font-weight: 700; font-size: 13px; color: #0f172a; margin-bottom: 6px; width: 75%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .folder-meta { font-size: 11px; color: #64748b; display: flex; flex-direction: column; gap: 4px; }
        .badge { background: #e0e7ff; color: var(--accent); padding: 2px 6px; border-radius: 4px; font-weight: 700; font-size: 10px; text-transform: uppercase; }
        
        .delete-btn { 
            position: absolute; top: 12px; right: 12px; 
            background: #fee2e2; color: var(--danger); border: none; 
            padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; 
        }
        .delete-btn:hover { background: var(--danger); color: white; }
        hr { border: none; border-top: 1px solid var(--border-color); margin: 12px 0; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        .folder-group { border-left: 3px solid var(--accent); background: #f8fafc !important; }
        #currentFolderHeader {
            display: none; align-items: center; gap: 8px; margin-bottom: 16px; 
            font-weight: 700; cursor: pointer; color: var(--accent); font-size: 13px;
            padding: 10px; background: #e0e7ff; border-radius: 8px; transition: all 0.2s;
        }
        #currentFolderHeader:hover { background: #c7d2fe; }
        .rename-btn { 
            position: absolute; top: 12px; right: 75px; /* Inusog pakaliwa para kasya sila ng Delete button */
            background: #e0e7ff; color: var(--accent); border: none; 
            padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; 
}
         .rename-btn:hover { background: var(--accent); color: white; }
        
        
}
        #co-author-pad {
    background: white;
    color: #333;
    max-width: 750px; /* Tamang lapad parang short bond paper */
    min-height: 350px; /* May sapat na taas para sa pagsusulat */
    margin: 30px auto; /* Gitna ng main workspace */
    padding: 30px;
    border-radius: 4px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.08); /* Mahinang shadow para lumutang ang papel */
    outline: none;
    font-family: 'Segoe UI', Arial, sans-serif;
    font-size: 15px;
    line-height: 1.6;
    text-align: left;
    overflow-y: auto;
}

/* Placeholder kapag walang laman ang dokumento */
#co-author-pad:empty:before {
    content: attr(placeholder);
    color: #aaa;
    font-style: italic;
}
        
    </style>
</head>
<body>

<div class="app-container">
    <div class="sidebar">
        <div class="sync-badge">⚡ Live Sync Active</div>
        
        <div>
            <h3>👥 Active Team Online</h3>
            <div id="onlineUsersList"></div>
            <div class="input-group" style="margin-top: 12px;">
                <select id="editorSelect"><option value="Jomari">Jomari</option></select>
            </div>
            <div class="input-group">
                <input type="text" id="newEditorInput" placeholder="Enter profile name...">
                <button class="btn outline" id="addEditorBtn" style="white-space: nowrap;">Join Hub</button>
            </div>
        </div>
        <hr>
        <div>
            <h3>📁 Resource</h3>
            <input type="file" id="fileUpload" accept="image/png, image/jpeg, application/pdf">
        </div>
        <hr>
        <div>
            <h3>🛠️ Style </h3>
            <div class="input-group">
                <input type="color" id="textColor" value="#4f46e5" title="Text Color">
                <input type="number" id="textSize" value="24" min="12" max="120" title="Font Size">
            </div>
            <div class="input-group">
                <button class="btn outline" id="undoBtn" style="flex: 1;">↩️ Undo Text</button>
                <button class="btn outline danger" id="deleteTextBtn" style="flex: 1;">🗑️ Delete</button>
            </div>
        </div>
        <hr>
        <div>
            <h3>💾 Export</h3>
            <div class="input-group">
                <select id="exportFormat">
                    <option value="png">PNG High-Res</option>
                    <option value="jpeg">JPEG Standard</option>
                    <option value="pdf">PDF Document</option>
                </select>
            </div>
            <button class="btn" id="downloadBtn" style="width: 100%;">Download</button>
        </div>
    </div>

    <div class="main-area">
        <div class="workspace" id="workspace">
            <h2 id="noFileText" style="color: #64748b; font-weight: 500; font-size: 15px; background: white; padding: 20px; border-radius: 12px; border: 1px dashed #cbd5e1;">
                Select a live document from the right directory panel to begin workspace engine collaboration.
            </h2>
            <div class="main-content"> <div id="image-container"> ...</div>

    <div id="co-author-pad" contenteditable="true" placeholder="Magsulat at mag-co-author dito kasama ang iyong katrabaho..."></div>

</div>
            <div class="image-container" id="imageContainer">
                <img id="mainImage" src="" alt="Live Synchronized Panel" crossorigin="anonymous">
                <div id="textLayer"></div>
            </div>
    <div class="right-sidebar">
        <h3>☁ Cloud Directory</h3>
        
        <div id="folderControls" style="display: flex; gap: 8px; margin-bottom: 12px;">
            <input type="text" id="newFolderInput" placeholder="New Folder Name...">
            <button class="btn outline" id="createFolderBtn" style="padding: 8px 12px;">+</button>
        </div>
        
        <div id="currentFolderHeader">⬅ Back to Root</div>
        
        <div id="directoryList"></div>
            </div> 
        </div>
  
           

<script>
    // =========================================================================
    // 🔥 CLOUDINARY CONFIGURATION 
    // =========================================================================
    const CLOUDINARY_CLOUD_NAME = "dhv16wfu3"; 
    const CLOUDINARY_UPLOAD_PRESET = "Workspace-Storage"; 
    // =========================================================================

    // MGA BAGONG MATITIBAY NA TULAY PARA SA LIVE SYNC
    const gun = Gun([
        'https://relay.peer.ooo/gun',
        'https://gun-server.fly.dev/gun'
    ]);
    const room = gun.get('jomari_workspace_global_v4_stable');

    let filesMap = {};
    let foldersMap = {};
    let activeFileId = null;
    let currentUser = "Jomari";
    let myAddedTexts = [];
    let currentFolderId = 'root'; 

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

    const els = {
        editorSelect: document.getElementById('editorSelect'),
        newEditorInput: document.getElementById('newEditorInput'),
        addEditorBtn: document.getElementById('addEditorBtn'),
        fileUpload: document.getElementById('fileUpload'),
        imageContainer: document.getElementById('imageContainer'),
        mainImage: document.getElementById('mainImage'),
        textLayer: document.getElementById('textLayer'),
        directoryList: document.getElementById('directoryList'),
        noFileText: document.getElementById('noFileText'),
        textColor: document.getElementById('textColor'),
        textSize: document.getElementById('textSize'),
        downloadBtn: document.getElementById('downloadBtn'),
        onlineUsersList: document.getElementById('onlineUsersList'),
        undoBtn: document.getElementById('undoBtn'),
        deleteTextBtn: document.getElementById('deleteTextBtn'),
        workspace: document.getElementById('workspace'),
        folderControls: document.getElementById('folderControls'),
        newFolderInput: document.getElementById('newFolderInput'),
        createFolderBtn: document.getElementById('createFolderBtn'),
        currentFolderHeader: document.getElementById('currentFolderHeader')
    };

    function heartbeat() { room.get('presence').get(currentUser).put({ name: currentUser, time: Date.now() }); }
    setInterval(heartbeat, 3000); heartbeat();

    room.get('presence').map().on((user, name) => {
        const nodeId = 'user_' + name.replace(/\s/g, '');
        if (!user) {
            const existingNode = document.getElementById(nodeId);
            if (existingNode) existingNode.remove();
            return;
        }
        if (Date.now() - user.time > 10000) {
            const node = document.getElementById(nodeId);
            if (node) node.remove();
            return;
        }
        let userEl = document.getElementById(nodeId);
        if (!userEl) {
            userEl = document.createElement('div');
            userEl.id = nodeId;
            userEl.className = 'user-badge';
            els.onlineUsersList.appendChild(userEl);
        }
        userEl.innerHTML = `
            <div class="user-info">
                <span class="status-dot"></span>
                <span>${user.name}</span>
            </div>
            <button class="kick-user-btn" onclick="kickUser('${name}', event)">&times;</button>
        `;
    });

    window.kickUser = function(targetName, event) {
        event.stopPropagation();
        if (confirm(`Alisin si "${targetName}" sa active list ng website?`)) { room.get('presence').get(targetName).put(null); }
    };

    els.editorSelect.onchange = () => { currentUser = els.editorSelect.value; heartbeat(); };
    els.addEditorBtn.onclick = () => {
        const name = els.newEditorInput.value.trim();
        if (name) {
            els.editorSelect.appendChild(new Option(name, name));
            els.editorSelect.value = name;
            els.newEditorInput.value = '';
            currentUser = name;
            heartbeat();
        }
    };

    function compressImage(base64Str, maxWidth = 600) {
        return new Promise((resolve) => {
            const img = new Image(); img.src = base64Str;
            img.onload = () => {
                const canvas = document.createElement('canvas');
                let w = img.width; let h = img.height;
                if (w > maxWidth) { h = (maxWidth / w) * h; w = maxWidth; }
                canvas.width = w; canvas.height = h;
                canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                resolve(canvas.toDataURL('image/jpeg', 0.50));
            };
        });
    }

    els.createFolderBtn.onclick = () => {
        const fName = els.newFolderInput.value.trim();
        if (fName) {
            const fId = 'folder_' + Date.now();
            room.get('folders').get(fId).put({ id: fId, name: fName });
            els.newFolderInput.value = '';
        }
    };

    els.currentFolderHeader.onclick = () => {
        currentFolderId = 'root';
        renderDirectory();
    };

    window.deleteFolder = function(id, event) {
        event.stopPropagation();
        if (confirm("Burahin ang folder na ito? (Ang mga files sa loob ay mananatili sa database pero mawawala ang folder na ito)")) {
            room.get('folders').get(id).put(null);
            if (currentFolderId === id) { currentFolderId = 'root'; }
        }
    };

    room.get('folders').map().on((folder, id) => {
        if (!folder) { delete foldersMap[id]; } else { foldersMap[id] = folder; }
        renderDirectory();
    });

    els.fileUpload.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        els.noFileText.innerText = "Processing & Uploading to Cloudinary (25GB Free Space)...";
        let rawSrc = "";

        if (file.type === 'application/pdf') {
            try {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
                const page = await pdf.getPage(1);
                const viewport = page.getViewport({scale: 1.5});
                const canvas = document.createElement('canvas');
                canvas.height = viewport.height; canvas.width = viewport.width;
                await page.render({canvasContext: canvas.getContext('2d'), viewport: viewport}).promise;
                rawSrc = canvas.toDataURL('image/png');
            } catch (err) { return alert("PDF processing engine error."); }
        } else {
            rawSrc = await new Promise(r => { const reader = new FileReader(); reader.onload = e => r(e.target.result); reader.readAsDataURL(file); });
        }

        const optimizedSrc = await compressImage(rawSrc);
        const dateObj = new Date();
        const fId = 'file_' + Date.now();
        
        try {
            const formData = new FormData();
            formData.append('file', optimizedSrc);
            formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
            formData.append('public_id', fId);

            const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
                method: 'POST',
                body: formData
            });

            const data = await response.json();
            
            if (data.secure_url) {
                room.get('files').get(fId).put({
                    id: fId, name: file.name, src: data.secure_url,
                    createdBy: currentUser, lastEditedBy: currentUser,
                    folderId: currentFolderId, 
                    date: dateObj.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }),
                    time: dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                });
                els.fileUpload.value = "";
                els.noFileText.innerText = "Upload Complete!";
            } else { throw new Error(data.error ? data.error.message : "Upload failed"); }
        } catch (error) {
            console.error("Cloudinary Upload Error:", error);
            alert("Error sa pag-upload sa Cloudinary. Siguraduhing tama ang Cloud Name at Unsigned Upload Preset mo.");
            resetWorkspace();
        }
    };

    room.get('files').map().on((file, id) => {
        if (!file) {
            delete filesMap[id];
            if (activeFileId === id) resetWorkspace();
        } else {
            filesMap[id] = { ...filesMap[id], ...file };
        }
       
        renderDirectory();
    });

    function renderDirectory() {
        els.directoryList.innerHTML = '';
        
        if (currentFolderId !== 'root') {
            els.currentFolderHeader.style.display = 'flex';
            els.currentFolderHeader.innerHTML = `⬅ Balik sa Root <br><span style="font-size:10px; color:#64748b; font-weight:500;">(Nasa loob ng: ${foldersMap[currentFolderId]?.name || 'Folder'})</span>`;
            els.folderControls.style.display = 'none';
        } else {
            els.currentFolderHeader.style.display = 'none';
            els.folderControls.style.display = 'flex';
            
            Object.values(foldersMap).forEach(folder => {
                const div = document.createElement('div');
                div.className = 'folder-item folder-group';
                div.onclick = () => { currentFolderId = folder.id; renderDirectory(); };
                div.innerHTML = `
                    <div class="folder-name" style="color: var(--accent); font-size: 14px;">📁 ${folder.name}</div>
                    <button class="delete-btn" onclick="deleteFolder('${folder.id}', event)">Delete</button>
                    <div class="folder-meta">Open Folder...</div>
                `;
                els.directoryList.appendChild(div);
            });
        }

        Object.values(filesMap).forEach(file => {
            const fileFolderId = file.folderId || 'root';
            if (fileFolderId !== currentFolderId) return;

            const div = document.createElement('div');
            div.className = `folder-item ${file.id === activeFileId ? 'active' : ''}`;
            div.onclick = () => switchToFile(file.id);
            div.innerHTML = `
                <div class="folder-name">📄 ${file.name}</div>
                <button class="rename-btn" onclick="renameFile('${file.id}', event)">Rename</button>
                <button class="delete-btn" onclick="deleteFile('${file.id}', event)">Delete</button>
                <div class="folder-meta">
                    <span><span class="badge">Author</span> ${file.createdBy}</span>
                    <span><span class="badge">Modified</span> ${file.lastEditedBy}</span>
                    <span style="color:var(--text-dark); font-weight:600; margin-top:4px;">📅 ${file.date} | ${file.time}</span>
                </div>`;
            els.directoryList.appendChild(div);
        });
    }

    let activeTextListeners = {};

    function switchToFile(id) {
        activeFileId = id;
        const file = filesMap[id];
        if (!file) return;

        els.mainImage.src = file.src;
        els.imageContainer.style.display = 'inline-block';
        els.noFileText.style.display = 'none';
        els.textLayer.innerHTML = '';
        
        Object.keys(activeTextListeners).forEach(k => room.get('texts').get(id).get(k).off());
        myAddedTexts = [];

        room.get('texts').get(id).get('data').map().on((textData, textId) => {
            renderOrUpdateText(textId, textData);
        });
        
        const coPad = document.getElementById('co-author-pad');
    
    // I-off ang lumang listener para sa nakaraang file
    if (window.activeCoAuthorListener) {
        window.activeCoAuthorListener.off();
    }

    // Konekta sa Gun.js node para sa text ng partikular na file na ito
    window.activeCoAuthorListener = room.get('files').get(id).get('documentText');
    window.activeCoAuthorListener.on((textData) => {
        // I-u-update lang ang screen mo kung hindi ikaw ang kasalukuyang nag-ta-type
        if (activeFileId === id && document.activeElement !== coPad) {
            coPad.innerHTML = textData || '';
        }
    });

        
        renderDirectory(); 
    }

    function renderOrUpdateText(textId, data) {
        let wrapper = document.getElementById(textId);
        let editable;
        let authorTag;

        if (!data) {
            if (wrapper) wrapper.remove();
            return;
        }
        
        if (!wrapper) {
            wrapper = document.createElement('div');
            wrapper.id = textId;
            wrapper.className = 'text-block-wrapper';
            
            editable = document.createElement('div');
            editable.className = 'text-editable';
            editable.contentEditable = 'true';
            
            authorTag = document.createElement('span');
            authorTag.className = 'text-author';
            
            wrapper.appendChild(editable);
            wrapper.appendChild(authorTag);
            
            let isDragging = false;
            let offsetX = 0; let offsetY = 0;
            
            wrapper.addEventListener('pointerdown', (e) => {
                if (e.target !== wrapper && document.activeElement === editable) return;
                isDragging = true;
                wrapper.dataset.dragging = "true";
                offsetX = e.clientX - wrapper.offsetLeft;
                offsetY = e.clientY - wrapper.offsetTop;
                wrapper.setPointerCapture(e.pointerId);
                
                document.querySelectorAll('.text-block-wrapper').forEach(el => el.classList.remove('active'));
                wrapper.classList.add('active');
                
                if (data.color) els.textColor.value = data.color;
                if (data.size) els.textSize.value = data.size;
            });
            
            wrapper.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                wrapper.style.left = (e.clientX - offsetX) + 'px';
                wrapper.style.top = (e.clientY - offsetY) + 'px';
            });
            
            wrapper.addEventListener('pointerup', (e) => {
                if (!isDragging) return;
                isDragging = false;
                wrapper.dataset.dragging = "false";
                wrapper.releasePointerCapture(e.pointerId);
                
                const node = room.get('texts').get(activeFileId).get('data').get(textId);
                node.get('x').put(parseFloat(wrapper.style.left));
                node.get('y').put(parseFloat(wrapper.style.top));
            });
            
            editable.oninput = () => {
                const node = room.get('texts').get(activeFileId).get('data').get(textId);
                node.get('text').put(editable.innerText);
                node.get('author').put(currentUser);
                
                room.get('files').get(activeFileId).get('lastEditedBy').put(currentUser);
                room.get('files').get(activeFileId).get('time').put(new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
            };
            
            editable.onfocus = () => {
                document.querySelectorAll('.text-block-wrapper').forEach(el => el.classList.remove('active'));
                wrapper.classList.add('active');
                if (data.color) els.textColor.value = data.color;
                if (data.size) els.textSize.value = data.size;
            };
            
            els.textLayer.appendChild(wrapper);
        } else {
            editable = wrapper.querySelector('.text-editable');
            authorTag = wrapper.querySelector('.text-author');
        }

        if (document.activeElement !== editable) {
            if (data.text !== undefined && editable.innerText !== data.text) { editable.innerText = data.text || ""; }
        }
        
        if (data.color) editable.style.color = data.color;
        if (data.size) editable.style.fontSize = data.size + 'px';
        
        if (wrapper.dataset.dragging !== "true") {
            if (data.x !== undefined) wrapper.style.left = data.x + 'px';
            if (data.y !== undefined) wrapper.style.top = data.y + 'px';
        }
        
        if (data.author) authorTag.innerText = data.author;
    }

    function updateActiveTextStyleInstant() {
        const activeNode = document.querySelector('.text-block-wrapper.active');
        if (activeNode && activeFileId) {
            const textId = activeNode.id;
            const node = room.get('texts').get(activeFileId).get('data').get(textId);
            node.get('color').put(els.textColor.value);
            node.get('size').put(els.textSize.value);
        }
    }
    els.textColor.oninput = updateActiveTextStyleInstant;
    els.textSize.oninput = updateActiveTextStyleInstant;

    els.workspace.onclick = (e) => {
        if (e.target === els.workspace || e.target === els.noFileText) {
            document.querySelectorAll('.text-block-wrapper').forEach(el => el.classList.remove('active'));
        }
    };

    els.imageContainer.onclick = (e) => {
        if ((e.target === els.imageContainer || e.target === els.textLayer) && activeFileId) {
            const rect = els.textLayer.getBoundingClientRect();
            const textId = 'text_' + Date.now();
            
            room.get('texts').get(activeFileId).get('data').get(textId).put({
                text: "Design Input...",
                color: els.textColor.value,
                size: els.textSize.value,
                x: e.clientX - rect.left,
                y: e.clientY - rect.top,
                author: currentUser
            });
            myAddedTexts.push(textId);
        }
    };

    els.undoBtn.onclick = () => {
        if (myAddedTexts.length > 0 && activeFileId) {
            const lastTextId = myAddedTexts.pop();
            room.get('texts').get(activeFileId).get('data').get(lastTextId).put(null);
        }
    };

    els.deleteTextBtn.onclick = () => {
        const activeNode = document.querySelector('.text-block-wrapper.active');
        if (activeNode && activeFileId) { room.get('texts').get(activeFileId).get('data').get(activeNode.id).put(null); }
    };

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Delete' && activeFileId) {
            const activeNode = document.querySelector('.text-block-wrapper.active');
            if (activeNode) { room.get('texts').get(activeFileId).get('data').get(activeNode.id).put(null); }
        }
    });

    
    window.deleteFile = function(id, event) {
        event.stopPropagation();
        if (confirm("Permanently erase document template node from global production environment?")) {
            room.get('texts').get(id).put(null);
            room.get('files').get(id).put(null);
            if (activeFileId === id) resetWorkspace();
        }
    };
   
    window.renameFile = function(id, event) {
    event.stopPropagation(); // Pinipigilan nito na mag-trigger ang pag-click sa buong file item
    const file = filesMap[id];
    if (!file) return;

    // Magpa-pop up ang isang box kung saan pwedeng i-type ang bagong pangalan
    const newName = prompt("Ipasok ang bagong pangalan ng file:", file.name);
    
    if (newName && newName.trim() !== "") {
        const dateObj = new Date();
        const fileNode = room.get('files').get(id);
        
        // I-a-update lang natin ang mga partikular na detalye sa Gun.js nang hindi nabubura ang 'src'
        fileNode.get('name').put(newName.trim());
        fileNode.get('lastEditedBy').put(currentUser);
        fileNode.get('date').put(dateObj.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }));
        fileNode.get('time').put(dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
    }
};

    function resetWorkspace() {
        activeFileId = null;
        els.imageContainer.style.display = 'none';
        els.noFileText.style.display = 'block';
        els.noFileText.innerText = "Select a live document from the right directory panel to begin workspace engine collaboration.";
        els.mainImage.src = '';
        els.textLayer.innerHTML = '';
    }

    
    els.downloadBtn.onclick = async () => {
        if (!activeFileId) return alert('Pumili muna ng document bago mag-export.');
        els.downloadBtn.innerText = 'Processing...';
        
        try {
            const exportContainer = document.createElement('div');
            exportContainer.style.position = 'absolute';
            exportContainer.style.left = '-9999px';
            exportContainer.style.display = 'inline-block';
            exportContainer.style.background = 'white';
            
            const imgClone = document.createElement('img');
            imgClone.src = els.mainImage.src;
            imgClone.crossOrigin = 'anonymous';
            
            const layerClone = els.textLayer.cloneNode(true);
            layerClone.querySelectorAll('.text-block-wrapper').forEach(el => {
                el.classList.remove('active');
                const editable = el.querySelector('.text-editable');
                if (editable) {
                    editable.style.border = 'none';
                    editable.style.background = 'transparent';
                }
                const author = el.querySelector('.text-author');
                if (author) author.style.display = 'none';
            });
            
            exportContainer.appendChild(imgClone);
            exportContainer.appendChild(layerClone);
            document.body.appendChild(exportContainer);
            
            const canvas = await html2canvas(exportContainer, { useCORS: true, allowTaint: true, scale: 2 });
            const format = document.getElementById('exportFormat').value;
            
            if (format === 'pdf') {
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF('p', 'mm', 'a4');
                const imgProps = pdf.getImageProperties(canvas);
                const pdfWidth = pdf.internal.pageSize.getWidth();
                const pdfHeight = (imgProps.height * pdfWidth) / imgProps.width;
                pdf.addImage(canvas.toDataURL('image/jpeg', 0.8), 'JPEG', 0, 0, pdfWidth, pdfHeight);
                pdf.save('Workspace_Export.pdf');
            } else {
                const link = document.createElement('a');
                link.download = `Workspace_Export.${format}`;
                link.href = canvas.toDataURL(`image/${format}`, format === 'jpeg' ? 0.9 : undefined);
                link.click();
            }
            document.body.removeChild(exportContainer);
        } catch (e) {
            console.error(e);
            alert("May error sa pag-export ng document.");
        }
        els.downloadBtn.innerText = 'Select a live document from the right directory panel to begin workspace engine collaboration.';
    };
    document.getElementById('co-author-pad').addEventListener('input', (e) => {
    if (activeFileId) {
        room.get('files').get(activeFileId).get('documentText').put(e.target.innerHTML);
    }
});



</script>
</body>
</html>
