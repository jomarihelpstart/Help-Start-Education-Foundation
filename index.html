<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Live Collaborative Workspace</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body { font-family: 'Inter', sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; background-color: #f8fafc; color: #1e293b; overflow: hidden; }
        
        /* Sync Status Banner */
        #statusBanner { background: #f59e0b; color: white; padding: 6px; text-align: center; font-size: 12px; font-weight: 600; display: block; letter-spacing: 0.5px; }
        #statusBanner.connected { background: #10b981; }

        .app-container { display: flex; flex: 1; overflow: hidden; }
        
        /* Sidebars */
        .sidebar { width: 300px; background: #ffffff; padding: 20px; border-right: 1px solid #e2e8f0; display: flex; flex-direction: column; gap: 16px; box-shadow: 2px 0 10px rgba(0,0,0,0.01); z-index: 10; overflow-y: auto; }
        .right-sidebar { width: 300px; background: #ffffff; padding: 20px; border-left: 1px solid #e2e8f0; display: flex; flex-direction: column; overflow-y: auto; z-index: 10; }
        
        /* Main Workspace */
        .main-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; background-image: radial-gradient(#cbd5e1 1px, transparent 0); background-size: 20px 20px; }
        .workspace { flex: 1; padding: 30px; display: flex; justify-content: center; align-items: flex-start; overflow: auto; }
        
        .image-container { position: relative; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); background: white; border-radius: 6px; display: none; border: 1px solid #cbd5e1; }
        .image-container img { max-width: 100%; display: block; border-radius: 6px; pointer-events: none; }
        
        /* Live Text Layers */
        #textLayer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .text-overlay { position: absolute; padding: 4px 8px; font-weight: 700; cursor: move; border: 1px dashed transparent; min-width: 40px; background: transparent; pointer-events: auto; white-space: nowrap; border-radius: 4px; }
        .text-overlay:focus, .text-overlay.active { outline: none; border: 1px dashed #2563eb; background: rgba(255, 255, 255, 0.85); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .text-author { position: absolute; bottom: -14px; left: 0; font-size: 9px; background: #2563eb; color: white; padding: 1px 4px; border-radius: 3px; font-weight: 500; display: none; pointer-events: none; }
        .text-overlay.active .text-author, .text-overlay:hover .text-author { display: block; }
        
        /* Active Presence List */
        .user-badge { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #f1f5f9; border-radius: 6px; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
        .status-dot { width: 8px; height: 8px; background: #10b981; border-radius: 50%; display: inline-block; box-shadow: 0 0 8px #10b981; }
        
        h3 { font-size: 12px; text-transform: uppercase; color: #64748b; margin: 0 0 8px 0; letter-spacing: 0.5px; font-weight: 700; }
        .input-group { display: flex; gap: 6px; margin-bottom: 8px; align-items: center; }
        input[type="text"], input[type="number"], select, input[type="file"] { flex: 1; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-family: 'Inter', sans-serif; font-size: 13px; transition: all 0.2s; }
        input[type="text"]:focus { border-color: #2563eb; outline: none; }
        input[type="color"] { width: 42px; height: 34px; padding: 0; border: 1px solid #cbd5e1; cursor: pointer; border-radius: 6px; background: none; }
        
        .btn { padding: 8px 12px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; font-family: 'Inter', sans-serif; font-size: 13px; transition: all 0.2s; display: flex; justify-content: center; align-items: center; gap: 4px; }
        .btn:hover { background: #1d4ed8; }
        .btn.outline { background: transparent; border: 1px solid #2563eb; color: #2563eb; }
        .btn.outline:hover { background: #eff6ff; }
        .btn.secondary { background: #e2e8f0; color: #334155; }
        .btn.secondary:hover { background: #cbd5e1; }
        
        /* Directory Cards */
        .folder-item { background: #f8fafc; border: 1px solid #e2e8f0; padding: 14px; border-radius: 8px; margin-bottom: 10px; cursor: pointer; transition: all 0.2s; position: relative; }
        .folder-item:hover { border-color: #94a3b8; background: #f1f5f9; }
        .folder-item.active { background: #eff6ff; border-color: #3b82f6; box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.1); }
        .folder-name { font-weight: 600; font-size: 13px; color: #0f172a; margin-bottom: 4px; width: 80%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .folder-meta { font-size: 11px; color: #64748b; display: flex; flex-direction: column; gap: 3px; }
        .badge { background: #e0f2fe; color: #0284c7; padding: 1px 4px; border-radius: 4px; font-weight: 600; font-size: 10px; }
        
        .delete-btn { position: absolute; top: 12px; right: 12px; background: #fee2e2; color: #ef4444; border: none; padding: 4px 6px; border-radius: 4px; font-size: 10px; font-weight: 600; cursor: pointer; }
        .delete-btn:hover { background: #fecaca; color: #b91c1c; }

        hr { border: none; border-top: 1px solid #e2e8f0; margin: 8px 0; }
    </style>
</head>
<body>

<div id="statusBanner">⚠️ RUNNING IN DEMO MODE (LOCAL). PALITAN ANG FIREBASE CONFIG PARA MAGING LIVE ONLINE SYNC!</div>

<div class="app-container">
    <div class="sidebar">
        <div>
            <h3>👥 Active Team Online</h3>
            <div id="onlineUsersList">
                </div>
            <div class="input-group" style="margin-top: 8px;">
                <select id="editorSelect"><option value="Jomari (Owner)">Jomari (Owner)</option></select>
            </div>
            <div class="input-group">
                <input type="text" id="newEditorInput" placeholder="Add team member...">
                <button class="btn outline" id="addEditorBtn">Join</button>
            </div>
        </div>
        <hr>
        
        <div>
            <h3>📁 Upload New Resource</h3>
            <input type="file" id="fileUpload" accept="image/png, image/jpeg, application/pdf">
        </div>
        <hr>

        <div>
            <h3>🛠️ Live Styling Engine</h3>
            <div class="input-group">
                <input type="color" id="textColor" value="#2563eb" title="Text Color">
                <input type="number" id="textSize" value="20" min="12" max="120" title="Font Size">
                <button class="btn outline" id="applyStyleBtn">Style</button>
            </div>
        </div>
        <hr>

        <div>
            <h3>💾 Master Export System</h3>
            <div class="input-group">
                <select id="exportFormat">
                    <option value="png">PNG Image</option>
                    <option value="jpeg">JPEG Image</option>
                    <option value="pdf">PDF Document</option>
                </select>
            </div>
            <button class="btn" id="downloadBtn" style="width: 100%;">⚡ High-Res Download</button>
        </div>
    </div>

    <div class="main-area">
        <div class="workspace" id="workspace">
            <h2 id="noFileText" style="color: #94a3b8; font-weight: 400; font-size: 16px;">Waiting for online project synchronization...</h2>
            <div class="image-container" id="imageContainer">
                <img id="mainImage" src="" alt="Live Synchronized Panel">
                <div id="textLayer"></div>
            </div>
        </div>
    </div>

    <div class="right-sidebar">
        <h3>☁️ Cloud File Directory</h3>
        <div id="directoryList"></div>
    </div>
</div>

<script>
    // --- CONNECTING TO FIREBASE (PALITAN MO ITO PARA MAGING LIVE ONLINE SYNC) ---
    const firebaseConfig = {
        apiKey: "AIzaSyBaQ5dEw-s2K2gBdZG4CGPD2pn1cLIZ64M",
        authDomain: "help-start-e6025.firebaseapp.com",
        databaseURL: "YOUR_DATABASE_URL",
        projectId: "help-start-e6025",
        storageBucket: "help-start-e6025.firebasestorage.app",
        messagingSenderId: "30156186075",
        appId: "1:30156186075:web:b79c0a404a3de2c2cb07fe"
    };

    let database = null;
    let isOnlineMode = false;

    // Check kung pinalitan na ni Jomari ang placeholders
    if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
        firebase.initializeApp(firebaseConfig);
        database = firebase.database();
        isOnlineMode = true;
        const banner = document.getElementById('statusBanner');
        banner.innerText = "🌐 LIVE ONLINE MODE (SYNCHRONIZED)";
        banner.className = "connected";
    }

    // --- SYSTEM STATES (LOCAL FALLBACKS) ---
    let localFilesData = [];
    let localTexts = {};
    let activeFileId = null;
    let currentUser = "Jomari (Owner)";

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

    const els = {
        editorSelect: document.getElementById('editorSelect'),
        newEditorInput: document.getElementById('newEditorInput'),
        addEditorBtn: document.getElementById('addEditorBtn'),
        fileUpload: document.getElementById('fileUpload'),
        imageContainer: document.getElementById('imageContainer'),
        mainImage: document.getElementById('mainImage'),
        textLayer: document.getElementById('textLayer'),
        directoryList: document.getElementById('directoryList'),
        noFileText: document.getElementById('noFileText'),
        textColor: document.getElementById('textColor'),
        textSize: document.getElementById('textSize'),
        applyStyleBtn: document.getElementById('applyStyleBtn'),
        downloadBtn: document.getElementById('downloadBtn'),
        onlineUsersList: document.getElementById('onlineUsersList')
    };

    // --- PRESENCE SYSTEM (SINO ANG GUMAGAWA) ---
    function updatePresence() {
        currentUser = els.editorSelect.value;
        if (isOnlineMode) {
            const userRef = database.ref('presence/' + currentUser.replace(/[.#$\[\]]/g, ""));
            userRef.set({ name: currentUser, lastActive: Date.now() });
            userRef.onDisconnect().remove();
        } else {
            renderLocalPresence();
        }
    }

    if (isOnlineMode) {
        database.ref('presence').on('value', (snapshot) => {
            els.onlineUsersList.innerHTML = '';
            snapshot.forEach((child) => {
                const user = child.val();
                els.onlineUsersList.innerHTML += `<div class="user-badge"><span class="status-dot"></span> ${user.name}</div>`;
            });
        });
    } else {
        function renderLocalPresence() {
            els.onlineUsersList.innerHTML = `<div class="user-badge"><span class="status-dot"></span> ${currentUser}</div>`;
        }
        renderLocalPresence();
    }

    els.editorSelect.onchange = () => updatePresence();
    els.addEditorBtn.onclick = () => {
        const name = els.newEditorInput.value.trim();
        if (name) {
            els.editorSelect.appendChild(new Option(name, name));
            els.editorSelect.value = name;
            els.newEditorInput.value = '';
            updatePresence();
        }
    };

    // --- IMAGE COMPRESSOR FOR SPEEDY REAL-TIME SYNC ---
    function compressImage(base64Str, maxWidth = 900) {
        return new Promise((resolve) => {
            const img = new Image();
            img.src = base64Str;
            img.onload = () => {
                const canvas = document.createElement('canvas');
                let width = img.width;
                let height = img.height;
                if (width > maxWidth) {
                    height = (maxWidth / width) * height;
                    width = maxWidth;
                }
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                resolve(canvas.toDataURL('image/jpeg', 0.75)); // Highly optimized compression
            };
        });
    }

    // --- CLOUD OR LOCAL UPLOAD SYSTEM ---
    els.fileUpload.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        els.noFileText.innerText = "Syncing with real-time network engine...";
        let rawSrc = "";

        if (file.type === 'application/pdf') {
            try {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
                const page = await pdf.getPage(1);
                const viewport = page.getViewport({scale: 2.0}); // Base render clear
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.height = viewport.height;
                canvas.width = viewport.width;
                await page.render({canvasContext: ctx, viewport: viewport}).promise;
                rawSrc = canvas.toDataURL('image/png');
            } catch (err) {
                alert("Failed to render PDF structure.");
                return;
            }
        } else {
            rawSrc = await new Promise(r => { const reader = new FileReader(); reader.onload = e => r(e.target.result); reader.readAsDataURL(file); });
        }

        const cloudReadySrc = await compressImage(rawSrc);
        const dateObj = new Date();
        const fileRecord = {
            id: 'file_' + Date.now(),
            name: file.name,
            src: cloudReadySrc,
            createdBy: currentUser,
            lastEditedBy: currentUser,
            date: dateObj.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }),
            time: dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };

        if (isOnlineMode) {
            database.ref('files/' + fileRecord.id).set(fileRecord);
        } else {
            localFilesData.push(fileRecord);
            switchToFile(fileRecord.id);
        }
        els.fileUpload.value = "";
    };

    // --- SYNCHRONIZED RE-RENDERING ---
    function switchToFile(id) {
        activeFileId = id;
        const filesList = isOnlineMode ? globalCloudFiles : localFilesData;
        const file = filesList.find(f => f.id === id);
        if(!file) return;

        els.mainImage.src = file.src;
        els.imageContainer.style.display = 'inline-block';
        els.noFileText.style.display = 'none';

        if (isOnlineMode) {
            // Makinig sa Realtime Database para sa live texts ng file na ito
            database.ref('texts/' + activeFileId).on('value', (snapshot) => {
                renderLiveTexts(snapshot.val() || {});
            });
        } else {
            renderLiveTexts(localTexts[activeFileId] || {});
        }
        renderDirectoryList(filesList);
    }

    function renderLiveTexts(textObject) {
        els.textLayer.innerHTML = '';
        Object.keys(textObject).forEach(key => {
            const data = textObject[key];
            const div = document.createElement('div');
            div.className = 'text-overlay';
            div.id = key;
            div.contentEditable = 'true';
            div.innerText = data.text;
            div.style.color = data.color;
            div.style.fontSize = data.size + 'px';
            div.style.left = data.x + 'px';
            div.style.top = data.y + 'px';
            div.innerHTML += `<span class="text-author">${data.author}</span>`;
            
            // Reattach live sync inputs
            div.oninput = () => updateTextData(key, div.innerText, data.x, data.y);
            div.onfocus = () => {
                document.querySelectorAll('.text-overlay').forEach(el => el.classList.remove('active'));
                div.classList.add('active');
                els.textColor.value = data.color;
                els.textSize.value = data.size;
            };
            els.textLayer.appendChild(div);
        });
    }

    // --- REALTIME ACTION UPDATER ---
    els.imageContainer.onclick = (e) => {
        if ((e.target === els.imageContainer || e.target === els.textLayer) && activeFileId) {
            const rect = els.textLayer.getBoundingClientRect();
            const textId = 'text_' + Date.now();
            const textData = {
                text: "Type...",
                color: els.textColor.value,
                size: els.textSize.value,
                x: e.clientX - rect.left,
                y: e.clientY - rect.top,
                author: currentUser
            };

            if (isOnlineMode) {
                database.ref('texts/' + activeFileId + '/' + textId).set(textData);
                database.ref('files/' + activeFileId).update({ lastEditedBy: currentUser, time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) });
            } else {
                if (!localTexts[activeFileId]) localTexts[activeFileId] = {};
                localTexts[activeFileId][textId] = textData;
                renderLiveTexts(localTexts[activeFileId]);
            }
        }
    };

    function updateTextData(textId, newText, x, y) {
        if (!activeFileId) return;
        if (isOnlineMode) {
            database.ref('texts/' + activeFileId + '/' + textId).update({ text: newText, author: currentUser });
        } else {
            localTexts[activeFileId][textId].text = newText;
            localTexts[activeFileId][textId].author = currentUser;
        }
    }

    els.applyStyleBtn.onclick = () => {
        const activeNode = document.querySelector('.text-overlay.active');
        if (activeNode && activeFileId) {
            if (isOnlineMode) {
                database.ref('texts/' + activeFileId + '/' + activeNode.id).update({ color: els.textColor.value, size: els.textSize.value });
            } else {
                localTexts[activeFileId][activeNode.id].color = els.textColor.value;
                localTexts[activeFileId][activeNode.id].size = els.textSize.value;
                renderLiveTexts(localTexts[activeFileId]);
            }
        }
    };

    // --- LIVE SYNC DATABASE LISTENERS ---
    let globalCloudFiles = [];
    if (isOnlineMode) {
        database.ref('files').on('value', (snapshot) => {
            globalCloudFiles = [];
            snapshot.forEach(child => { globalCloudFiles.push(child.val()); });
            renderDirectoryList(globalCloudFiles);
            if(activeFileId && !globalCloudFiles.find(f => f.id === activeFileId)) {
                // Kung dinelete ng ibang tao habang nakabukas mo
                location.reload();
            }
        });
    }

    function renderDirectoryList(filesArray) {
        els.directoryList.innerHTML = '';
        filesArray.forEach(file => {
            const div = document.createElement('div');
            div.className = `folder-item ${file.id === activeFileId ? 'active' : ''}`;
            div.onclick = () => switchToFile(file.id);
            div.innerHTML = `
                <div class="folder-name">📁 ${file.name}</div>
                <button class="delete-btn" onclick="deleteCloudFile('${file.id}', event)">Delete</button>
                <div class="folder-meta">
                    <span><span class="badge">Created By</span> ${file.createdBy}</span>
                    <span><span class="badge">Active Editor</span> ${file.lastEditedBy}</span>
                    <span style="color:#1e293b; font-weight:500; margin-top:2px;">📅 ${file.date} | ${file.time}</span>
                </div>`;
            els.directoryList.appendChild(div);
        });
    }

    window.deleteCloudFile = function(id, event) {
        event.stopPropagation();
        if (confirm("Delete this document across all active user terminals?")) {
            if (isOnlineMode) {
                database.ref('files/' + id).remove();
                database.ref('texts/' + id).remove();
            } else {
                localFilesData = localFilesData.filter(f => f.id !== id);
                delete localTexts[id];
                if(activeFileId === id) {
                    activeFileId = null;
                    els.imageContainer.style.display = 'none';
                    els.noFileText.style.display = 'block';
                }
                renderDirectoryList(localFilesData);
            }
        }
    };

    // --- HIGH-RESOLUTION ULTRA EXPORT ENGINE ---
    els.downloadBtn.onclick = () => {
        if (!activeFileId) return alert("Select an active synced project node.");
        document.querySelectorAll('.text-overlay').forEach(el => el.classList.remove('active'));

        const format = document.getElementById('exportFormat').value;
        const filesList = isOnlineMode ? globalCloudFiles : localFilesData;
        const fName = filesList.find(f => f.id === activeFileId).name.split('.')[0];

        html2canvas(els.imageContainer, { useCORS: true, backgroundColor: null, scale: 3 }).then(canvas => {
            if (format === 'pdf') {
                const imgData = canvas.toDataURL('image/jpeg', 1.0);
                const { jsPDF } = window.jspdf;
                const w = canvas.width / 3; const h = canvas.height / 3;
                const pdf = new jsPDF({ orientation: w > h ? 'l' : 'p', unit: 'px', format: [w, h] });
                pdf.addImage(imgData, 'JPEG', 0, 0, w, h);
                pdf.save(`${fName}_SyncDone.pdf`);
            } else {
                const link = document.createElement('a');
                link.download = `${fName}_SyncDone.${format}`;
                link.href = canvas.toDataURL(`image/${format}`, 1.0);
                link.click();
            }
        });
    };
</script>
</body>
</html>
