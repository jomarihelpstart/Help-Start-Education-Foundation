<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant Live Collaborative Workspace</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body { font-family: 'Inter', sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; background-color: #f8fafc; color: #1e293b; overflow: hidden; }
        
        #statusBanner { background: #10b981; color: white; padding: 6px; text-align: center; font-size: 12px; font-weight: 600; display: block; letter-spacing: 0.5px; }

        .app-container { display: flex; flex: 1; overflow: hidden; }
        
        .sidebar { width: 300px; background: #ffffff; padding: 20px; border-right: 1px solid #e2e8f0; display: flex; flex-direction: column; gap: 16px; box-shadow: 2px 0 10px rgba(0,0,0,0.01); z-index: 10; overflow-y: auto; }
        .right-sidebar { width: 300px; background: #ffffff; padding: 20px; border-left: 1px solid #e2e8f0; display: flex; flex-direction: column; overflow-y: auto; z-index: 10; }
        
        .main-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; background-image: radial-gradient(#cbd5e1 1px, transparent 0); background-size: 20px 20px; }
        .workspace { flex: 1; padding: 30px; display: flex; justify-content: center; align-items: flex-start; overflow: auto; }
        
        .image-container { position: relative; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); background: white; border-radius: 6px; display: none; border: 1px solid #cbd5e1; }
        .image-container img { max-width: 100%; display: block; border-radius: 6px; pointer-events: none; }
        
        #textLayer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .text-overlay { position: absolute; padding: 4px 8px; font-weight: 700; cursor: move; border: 1px dashed transparent; min-width: 40px; background: transparent; pointer-events: auto; white-space: nowrap; border-radius: 4px; }
        .text-overlay:focus, .text-overlay.active { outline: none; border: 1px dashed #6366f1; background: rgba(255, 255, 255, 0.85); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .text-author { position: absolute; bottom: -14px; left: 0; font-size: 9px; background: #6366f1; color: white; padding: 1px 4px; border-radius: 3px; font-weight: 500; display: none; pointer-events: none; }
        .text-overlay.active .text-author, .text-overlay:hover .text-author { display: block; }
        
        .user-badge { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #f1f5f9; border-radius: 6px; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
        .status-dot { width: 8px; height: 8px; background: #10b981; border-radius: 50%; display: inline-block; box-shadow: 0 0 8px #10b981; }
        
        h3 { font-size: 12px; text-transform: uppercase; color: #64748b; margin: 0 0 8px 0; letter-spacing: 0.5px; font-weight: 700; }
        .input-group { display: flex; gap: 6px; margin-bottom: 8px; align-items: center; }
        input[type="text"], input[type="number"], select, input[type="file"] { flex: 1; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-family: 'Inter', sans-serif; font-size: 13px; }
        input[type="color"] { width: 42px; height: 34px; padding: 0; border: 1px solid #cbd5e1; cursor: pointer; border-radius: 6px; background: none; }
        
        .btn { padding: 8px 12px; background: #6366f1; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; font-family: 'Inter', sans-serif; font-size: 13px; display: flex; justify-content: center; align-items: center; }
        .btn:hover { background: #4f46e5; }
        .btn.outline { background: transparent; border: 1px solid #6366f1; color: #6366f1; }
        .btn.outline:hover { background: #e0e7ff; }
        
        .folder-item { background: #f8fafc; border: 1px solid #e2e8f0; padding: 14px; border-radius: 8px; margin-bottom: 10px; cursor: pointer; transition: all 0.2s; position: relative; }
        .folder-item:hover { border-color: #94a3b8; background: #f1f5f9; }
        .folder-item.active { background: #e0e7ff; border-color: #6366f1; box-shadow: 0 4px 6px -1px rgba(99, 102, 241, 0.1); }
        .folder-name { font-weight: 600; font-size: 13px; color: #0f172a; margin-bottom: 4px; width: 80%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .folder-meta { font-size: 11px; color: #64748b; display: flex; flex-direction: column; gap: 3px; }
        .badge { background: #e0e7ff; color: #4f46e5; padding: 1px 4px; border-radius: 4px; font-weight: 600; font-size: 10px; }
        
        .delete-btn { position: absolute; top: 12px; right: 12px; background: #fee2e2; color: #ef4444; border: none; padding: 4px 6px; border-radius: 4px; font-size: 10px; font-weight: 600; cursor: pointer; }
        .delete-btn:hover { background: #fecaca; color: #b91c1c; }
        hr { border: none; border-top: 1px solid #e2e8f0; margin: 8px 0; }
    </style>
</head>
<body>

<div id="statusBanner">🌐 INSTANT SYNC LIVE ONLINE MODE (NO CONFIG REQUIRED)</div>

<div class="app-container">
    <div class="sidebar">
        <div>
            <h3>👥 Active Team Online</h3>
            <div id="onlineUsersList"></div>
            <div class="input-group" style="margin-top: 8px;">
                <select id="editorSelect"><option value="Jomari">Jomari</option></select>
            </div>
            <div class="input-group">
                <input type="text" id="newEditorInput" placeholder="Type your name...">
                <button class="btn outline" id="addEditorBtn">Join Team</button>
            </div>
        </div>
        <hr>
        <div>
            <h3>📁 Upload Resource</h3>
            <input type="file" id="fileUpload" accept="image/png, image/jpeg, application/pdf">
        </div>
        <hr>
        <div>
            <h3>🛠️ Text Style</h3>
            <div class="input-group">
                <input type="color" id="textColor" value="#6366f1" title="Text Color">
                <input type="number" id="textSize" value="22" min="12" max="120" title="Font Size">
                <button class="btn outline" id="applyStyleBtn">Apply</button>
            </div>
        </div>
        <hr>
        <div>
            <h3>💾 Master Export</h3>
            <div class="input-group">
                <select id="exportFormat">
                    <option value="png">PNG Image</option>
                    <option value="jpeg">JPEG Image</option>
                    <option value="pdf">PDF Document</option>
                </select>
            </div>
            <button class="btn" id="downloadBtn" style="width: 100%;">⚡ High-Res Download</button>
        </div>
    </div>

    <div class="main-area">
        <div class="workspace" id="workspace">
            <h2 id="noFileText" style="color: #94a3b8; font-weight: 400; font-size: 16px;">Select or Upload a file from the Cloud Directory to start collaborating!</h2>
            <div class="image-container" id="imageContainer">
                <img id="mainImage" src="" alt="Live Synchronized Panel">
                <div id="textLayer"></div>
            </div>
        </div>
    </div>

    <div class="right-sidebar">
        <h3>☁️ Live Project Directory</h3>
        <div id="directoryList"></div>
    </div>
</div>

<script>
    // --- AUTOMATIC PEER-TO-PEER NETWORK INITIALIZATION ---
    // Kumokonekta ito sa mga pampublikong GunDB nodes para mag-sync nang walang account.
    const gun = Gun([
        'https://gun-manhattan.herokuapp.com/gun',
        'https://relay.peer.ooo/gun'
    ]);
    
    // Ito ang magiging sikretong kwarto ng team ninyo. Pwede mong palitan ang pangalan kung gusto mo.
    const room = gun.get('jomari_shared_workspace_global_2026');

    let filesMap = {};
    let activeFileId = null;
    let currentUser = "Jomari";

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

    const els = {
        editorSelect: document.getElementById('editorSelect'),
        newEditorInput: document.getElementById('newEditorInput'),
        addEditorBtn: document.getElementById('addEditorBtn'),
        fileUpload: document.getElementById('fileUpload'),
        imageContainer: document.getElementById('imageContainer'),
        mainImage: document.getElementById('mainImage'),
        textLayer: document.getElementById('textLayer'),
        directoryList: document.getElementById('directoryList'),
        noFileText: document.getElementById('noFileText'),
        textColor: document.getElementById('textColor'),
        textSize: document.getElementById('textSize'),
        applyStyleBtn: document.getElementById('applyStyleBtn'),
        downloadBtn: document.getElementById('downloadBtn'),
        onlineUsersList: document.getElementById('onlineUsersList')
    };

    // --- REALTIME PRESENCE (SINO ANG ONLINE) ---
    function heartbeat() {
        room.get('presence').get(currentUser).put({ name: currentUser, time: Date.now() });
    }
    setInterval(heartbeat, 3000); // Sabihin sa network bawat 3 segundo na online ka
    heartbeat();

    room.get('presence').map().on((user, name) => {
        if (!user) return;
        // Kapag hindi nagparamdam ng higit sa 8 segundo, ituring na offline
        if (Date.now() - user.time > 8000) {
            const node = document.getElementById('user_' + name.replace(/\s/g, ''));
            if (node) node.remove();
            return;
        }
        let userEl = document.getElementById('user_' + name.replace(/\s/g, ''));
        if (!userEl) {
            userEl = document.createElement('div');
            userEl.id = 'user_' + name.replace(/\s/g, '');
            userEl.className = 'user-badge';
            els.onlineUsersList.appendChild(userEl);
        }
        userEl.innerHTML = `<span class="status-dot"></span> ${user.name}`;
    });

    els.editorSelect.onchange = () => { currentUser = els.editorSelect.value; heartbeat(); };
    els.addEditorBtn.onclick = () => {
        const name = els.newEditorInput.value.trim();
        if (name) {
            els.editorSelect.appendChild(new Option(name, name));
            els.editorSelect.value = name;
            els.newEditorInput.value = '';
            currentUser = name;
            heartbeat();
        }
    };

    // --- OPTIMIZED COMPRESSOR ---
    function compressImage(base64Str, maxWidth = 800) {
        return new Promise((resolve) => {
            const img = new Image();
            img.src = base64Str;
            img.onload = () => {
                const canvas = document.createElement('canvas');
                let w = img.width; let h = img.height;
                if (w > maxWidth) { h = (maxWidth / w) * h; w = maxWidth; }
                canvas.width = w; canvas.height = h;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, w, h);
                resolve(canvas.toDataURL('image/jpeg', 0.65)); // Magaan para mabilis mag-sync
            };
        });
    }

    // --- REALTIME UPLOAD ---
    els.fileUpload.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        els.noFileText.innerText = "Broadcasting to team terminals...";
        let rawSrc = "";

        if (file.type === 'application/pdf') {
            try {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
                const page = await pdf.getPage(1);
                const viewport = page.getViewport({scale: 1.5});
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.height = viewport.height; canvas.width = viewport.width;
                await page.render({canvasContext: ctx, viewport: viewport}).promise;
                rawSrc = canvas.toDataURL('image/png');
            } catch (err) { return alert("PDF error"); }
        } else {
            rawSrc = await new Promise(r => { const reader = new FileReader(); reader.onload = e => r(e.target.result); reader.readAsDataURL(file); });
        }

        const optimizedSrc = await compressImage(rawSrc);
        const dateObj = new Date();
        const fId = 'file_' + Date.now();
        
        room.get('files').get(fId).put({
            id: fId,
            name: file.name,
            src: optimizedSrc,
            createdBy: currentUser,
            lastEditedBy: currentUser,
            date: dateObj.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }),
            time: dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        });
        
        els.fileUpload.value = "";
    };

    // --- SYNC ENGINE LISTENERS ---
    room.get('files').map().on((file, id) => {
        if (!file) {
            delete filesMap[id];
            const folderItem = document.getElementById('card_' + id);
            if (folderItem) folderItem.remove();
            if (activeFileId === id) resetWorkspace();
            return;
        }
        filesMap[id] = file;
        renderDirectoryCard(file);
    });

    function renderDirectoryCard(file) {
        let div = document.getElementById('card_' + file.id);
        if (!div) {
            div = document.createElement('div');
            div.id = 'card_' + file.id;
            els.directoryList.appendChild(div);
        }
        div.className = `folder-item ${file.id === activeFileId ? 'active' : ''}`;
        div.onclick = () => switchToFile(file.id);
        div.innerHTML = `
            <div class="folder-name">📁 ${file.name}</div>
            <button class="delete-btn" onclick="deleteFile('${file.id}', event)">Delete</button>
            <div class="folder-meta">
                <span><span class="badge">Creator</span> ${file.createdBy}</span>
                <span><span class="badge">Editor</span> ${file.lastEditedBy}</span>
                <span style="color:#1e293b; margin-top:2px;">📅 ${file.date} | ${file.time}</span>
            </div>`;
    }

    let activeTextListeners = {};

    function switchToFile(id) {
        activeFileId = id;
        const file = filesMap[id];
        if (!file) return;

        els.mainImage.src = file.src;
        els.imageContainer.style.display = 'inline-block';
        els.noFileText.style.display = 'none';

        // I-clear ang mga dating texts sa screen
        els.textLayer.innerHTML = '';
        
        // Patayin ang mga lumang realtime listeners para sa nakaraang file
        Object.keys(activeTextListeners).forEach(k => room.get('texts').get(id).get(k).off());

        // Makinig sa mga bagong live texts para sa file na pinili
        room.get('texts').get(id).get('data').map().on((textData, textId) => {
            if (!textData) {
                const node = document.getElementById(textId);
                if (node) node.remove();
                return;
            }
            renderOrUpdateText(textId, textData);
        });

        // I-update ang highlight sa listahan
        Object.keys(filesMap).forEach(k => renderDirectoryCard(filesMap[k]));
    }

    function renderOrUpdateText(textId, data) {
        let div = document.getElementById(textId);
        if (!div) {
            div = document.createElement('div');
            div.id = textId;
            div.className = 'text-overlay';
            div.contentEditable = 'true';
            
            div.oninput = () => {
                room.get('texts').get(activeFileId).get('data').get(textId).put({ text: div.innerText, author: currentUser });
                room.get('files').get(activeFileId).put({ lastEditedBy: currentUser, time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) });
            };
            
            div.onfocus = () => {
                document.querySelectorAll('.text-overlay').forEach(el => el.classList.remove('active'));
                div.classList.add('active');
                els.textColor.value = data.color;
                els.textSize.value = data.size;
            };
            
            els.textLayer.appendChild(div);
        }

        // Huwag i-overwrite ang cursor kung ang user mismo ang nag-ti-type nito
        if (document.activeElement !== div) {
            div.innerText = data.text;
        }
        
        div.style.color = data.color;
        div.style.fontSize = data.size + 'px';
        div.style.left = data.x + 'px';
        div.style.top = data.y + 'px';
        
        // Linisin ang lumang badge bago maglagay ng bago
        const oldAuthor = div.querySelector('.text-author');
        if (oldAuthor) oldAuthor.remove();
        div.innerHTML += `<span class="text-author">${data.author}</span>`;
    }

    // --- LIVE ADD TEXT ON CLICK ---
    els.imageContainer.onclick = (e) => {
        if ((e.target === els.imageContainer || e.target === els.textLayer) && activeFileId) {
            const rect = els.textLayer.getBoundingClientRect();
            const textId = 'text_' + Date.now();
            
            room.get('texts').get(activeFileId).get('data').get(textId).put({
                text: "Click & Type...",
                color: els.textColor.value,
                size: els.textSize.value,
                x: e.clientX - rect.left,
                y: e.clientY - rect.top,
                author: currentUser
            });
        }
    };

    els.applyStyleBtn.onclick = () => {
        const activeNode = document.querySelector('.text-overlay.active');
        if (activeNode && activeFileId) {
            room.get('texts').get(activeFileId).get('data').get(activeNode.id).put({
                color: els.textColor.value,
                size: els.textSize.value
            });
        }
    };

    // --- DELETE LOGIC ---
    window.deleteFile = function(id, event) {
        event.stopPropagation();
        if (confirm("Gusto mo ba talagang burahin ito sa lahat ng katrabaho mo?")) {
            room.get('files').get(id).put(null);
            room.get('texts').get(id).put(null);
        }
    };

    function resetWorkspace() {
        activeFileId = null;
        els.imageContainer.style.display = 'none';
        els.noFileText.style.display = 'block';
        els.noFileText.innerText = "Select or Upload a file from the Cloud Directory to start collaborating!";
    }

    // --- HIGH RESOLUTION MASTER EXPORT ---
    els.downloadBtn.onclick = () => {
        if (!activeFileId) return alert("Pumili muna ng file sa directory.");
        document.querySelectorAll('.text-overlay').forEach(el => el.classList.remove('active'));
        const format = document.getElementById('exportFormat').value;
        const fName = filesMap[activeFileId].name.split('.')[0];

        html2canvas(els.imageContainer, { useCORS: true, backgroundColor: null, scale: 3 }).then(canvas => {
            if (format === 'pdf') {
                const imgData = canvas.toDataURL('image/jpeg', 1.0);
                const { jsPDF } = window.jspdf;
                const w = canvas.width / 3; const h = canvas.height / 3;
                const pdf = new jsPDF({ orientation: w > h ? 'l' : 'p', unit: 'px', format: [w, h] });
                pdf.addImage(imgData, 'JPEG', 0, 0, w, h);
                pdf.save(`${fName}_MasterLive.pdf`);
            } else {
                const link = document.createElement('a');
                link.download = `${fName}_MasterLive.${format}`;
                link.href = canvas.toDataURL(`image/${format}`, 1.0);
                link.click();
            }
        });
    };
</script>
</body>
</html>
